[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "reading-queue"
version = "0.1.0"
description = "SQLite-backed CLI reading list with priorities, status, tags and progress statistics."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "JANIN A APURBA", email = "japurba97@gmail.com"}]
keywords = ["research", "automation", "reproducibility", "academic"]
dependencies = []

[project.scripts]
reading-queue = "reading_queue.cli:main"

[tool.setuptools]
packages = ["reading_queue"]
